<style>
        body {
            background-color: #eff6ed; /* Specified Cream Background */
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            vertical-align: middle;
        }

        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(92, 18, 18, 0.08); /* Tinted shadow per guidance */
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        .focus-ring:focus {
            outline: none;
            border-color: #5c1212;
            box-shadow: 0 0 0 4px rgba(92, 18, 18, 0.1);
        }
        
        /* Subtle architectural pattern background for texture */
        .pattern-bg {
            background-image: radial-gradient(#e8c39e 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.2;
        }

<body class="min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Texture -->
<div class="absolute inset-0 pattern-bg pointer-events-none"></div>
<!-- Top Decorative Gradient -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop relative z-10">
<div class="w-full max-w-md">
<!-- Brand Identity Container -->
<div class="text-center mb-base">
<div class="inline-flex items-center justify-center mb-8">
<!-- Logo Reconstruction based on Brand Anchors -->
<div class="flex flex-col items-center">
<div class="flex items-baseline gap-2">
<span class="material-symbols-outlined text-primary text-4xl mb-2" style="font-variation-settings: 'FILL' 1;">home_work</span>
<div class="flex flex-col items-start leading-none">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">ivonne marin.</h1>
<p class="font-label-md text-[10px] tracking-[0.2em] text-secondary opacity-80 mt-1 uppercase">asesora inmobiliaria</p>
</div>
</div>
</div>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-xl ambient-shadow border border-outline-variant/30 relative overflow-hidden">
<!-- Inner top bar accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<header class="mb-10">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Ingresar al sistema</h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Panel privado de administración inmobiliaria.</p>
</header>
<form class="space-y-6" onsubmit="event.preventDefault(); window.location.reload();">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Correo Electrónico</label>
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/50 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md focus-ring transition-all" id="email" placeholder="nombre@ivonnemarin.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/50 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md focus-ring transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all" type="checkbox"/>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors hover:underline decoration-1 underline-offset-4" href="#">
                            Recuperar contraseña
                        </a>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-on-primary-fixed-variant hover:bg-primary transition-all duration-300 py-4 rounded-lg font-headline-md text-[18px] shadow-lg shadow-primary/10 flex items-center justify-center gap-2 group active:scale-[0.98]" type="submit">
<span>Ingresar al dashboard</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">login</span>
</button>
</form>
<!-- Security Badge -->
<div class="mt-10 pt-6 border-t border-outline-variant/20 flex items-center justify-center gap-3 opacity-60">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="text-[12px] font-label-md uppercase tracking-widest">Conexión segura SSL</span>
</div>
</div>
<!-- Footer links -->
<div class="mt-8 flex justify-center gap-8">
<a class="font-label-md text-[12px] text-on-surface-variant/70 hover:text-primary transition-colors" href="#">Ayuda técnica</a>
<a class="font-label-md text-[12px] text-on-surface-variant/70 hover:text-primary transition-colors" href="#">Ivonne Marin Web</a>
<a class="font-label-md text-[12px] text-on-surface-variant/70 hover:text-primary transition-colors" href="#">Privacidad</a>
</div>
</div>
</main>
<!-- Decorative Image Bleed (Subtle corner hint of luxury property) -->
<div class="hidden lg:block absolute bottom-0 right-0 w-1/3 h-1/2 opacity-20 pointer-events-none">
<img class="w-full h-full object-cover object-left-top mask-gradient" data-alt="A sophisticated luxury penthouse interior in the Eje Cafetero region. Wide open spaces with warm lighting, wood accents, and large windows overlooking lush green mountains. The style is minimalist and elegant, using a color palette of burgundies, warm whites, and beige to create a high-end residential atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDSSvwF1FY7ggI1RI-dqgo3-sCyA-T7pWjVQueK5hD1fuvqfX7vtjYpDcmSCDiyn7nTg5zYtFbsjbcTkA3nrIUcK2spSGR7ZPTIhue-AlGMpEbv7jYzi5v_ze1b6-GFKo2C3ZW28jP7zFYW_8MM-OLsOcVZk9PnNrmfh-JMEIFxnLaywUYsLy4mFp8WeAd8gP3mdAbygzpABYmtnYqD4madoQ1X42bfEexA4k7FOJu1hcaNKBk4cGIlTylO9aC2JSiY8S34CzbZS64"/>
</div>
<style>
        .mask-gradient {
            mask-image: linear-gradient(to top left, black, transparent);
            -webkit-mask-image: linear-gradient(to top left, black, transparent);
        }
    </style>
<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
